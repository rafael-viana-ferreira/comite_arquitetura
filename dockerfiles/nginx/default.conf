server {
    listen 80;
    index index.php;
    root /var/www/public;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    location ~* \.php$ {
        return 404;
    }
}